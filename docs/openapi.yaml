openapi: 3.0.3
info:
  title: Autenticación Lab — API
  description: |
    Laboratorio experimental de mecanismos de autenticación ante cambios
    dinámicos de privilegios. Los cuatro mecanismos operan los mismos
    endpoints y pasan por el mismo AuthorizeAction.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
security: []
paths:
  /tickets:
    get:
      summary: Listar tickets (permiso READ)
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Lista de tickets
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Crear ticket (permiso WRITE)
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: string, nullable: true }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
      responses:
        '201':
          description: Ticket creado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tickets/{id}:
    get:
      summary: Ver ticket (permiso READ, registra vista)
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Ticket
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar ticket (permiso WRITE)
      responses:
        '200':
          description: Ticket actualizado
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Eliminar ticket soft delete (permiso DELETE)
      responses:
        '204':
          description: Eliminado
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tickets/{id}/status:
    post:
      summary: Cambiar estado (permiso WRITE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, ESCALATED, RESOLVED, CLOSED] }
      responses:
        '200':
          description: Ticket con nuevo estado
        '422':
          description: Transición inválida
  /tickets/{id}/assign:
    post:
      summary: Asignar a usuario o rol (permiso WRITE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer }
                role: { type: string }
      responses:
        '200':
          description: Ticket asignado
  /tickets/{id}/escalate:
    post:
      summary: Escalar a un rol (permiso WRITE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_role]
              properties:
                to_role: { type: string }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Ticket escalado
  /tickets/{id}/history:
    get:
      summary: Bitácora del ticket (permiso READ)
      responses:
        '200':
          description: Entradas de historial
  /tickets/{id}/views:
    get:
      summary: Vistas del ticket (permiso READ)
      responses:
        '200':
          description: Vistas registradas
  /tickets/{id}/escalations:
    get:
      summary: Escalamientos del ticket (permiso READ)
      responses:
        '200':
          description: Escalamientos registrados
  /users:
    get:
      summary: Listar usuarios (sin auth, bootstrap)
      responses:
        '200':
          description: Usuarios
    post:
      summary: Registrar usuario (sin auth, bootstrap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Usuario creado
    /users/me:
    get:
      summary: Perfil del usuario autenticado con roles y permisos efectivos
      description: |
        Devuelve la identidad del principal ya autenticado por el middleware
        flexible (X-API-Key, Basic, Bearer JWT o Bearer OAuth con
        X-Auth-Mechanism: oauth) junto con sus roles vigentes y la unión
        plana, deduplicada y ordenada de los permisos de todos sus roles.

        Los permisos se resuelven contra el estado actual en base de datos en
        cada request. No hay caché ni permisos embebidos en la credencial:
        un rol revocado deja de aportar sus permisos en la siguiente llamada.
      security:
        - Basic: []
        - ApiKey: []
        - JwtBearer: []
        - OAuthBearer: []
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        '400':
          description: X-Auth-Mechanism desconocido con Bearer (invalid_mechanism)
          content:
            application/json:
              example: { error: invalid_mechanism }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}:
    get:
      summary: Ver usuario
      responses:
        '200':
          description: Usuario
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualizar usuario
      responses:
        '200':
          description: Usuario actualizado
  /users/{id}/deactivate:
    post:
      summary: Desactivar usuario
      responses:
        '200':
          description: Usuario desactivado
  /users/{id}/password:
    post:
      summary: Cambiar contraseña
      responses:
        '200':
          description: Contraseña cambiada
  /users/{id}/roles:
    post:
      summary: Asignar rol (escalado del experimento)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string }
      responses:
        '204':
          description: Rol asignado
  /users/{id}/roles/{roleName}:
    delete:
      summary: Revocar rol (reducción del experimento)
      responses:
        '204':
          description: Rol revocado
  /roles:
    get:
      summary: Listar roles
      responses:
        '200':
          description: Roles con permisos
    post:
      summary: Crear rol dinámico
      responses:
        '201':
          description: Rol creado
  /roles/{name}:
    put:
      summary: Actualizar rol libre
      responses:
        '200':
          description: Rol actualizado
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Borrar rol libre
      responses:
        '204':
          description: Rol borrado
        '409':
          $ref: '#/components/responses/Conflict'
  /roles/{name}/permissions:
    put:
      summary: Sincronizar permisos de un rol
      responses:
        '204':
          description: Permisos sincronizados
  /permissions:
    get:
      summary: Listar permisos
      responses:
        '200':
          description: Permisos
    post:
      summary: Crear permiso dinámico
      responses:
        '201':
          description: Permiso creado
  /permissions/{name}:
    put:
      summary: Actualizar permiso libre
      responses:
        '200':
          description: Permiso actualizado
    delete:
      summary: Borrar permiso libre
      responses:
        '204':
          description: Permiso borrado
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/api-key/login:
    post:
      summary: Verificar API Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '200':
          description: Principal autenticado
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/api-key/issue:
    post:
      summary: Emitir API Key (permiso ADMIN, plano una sola vez)
      security:
        - Basic: []
        - ApiKey: []
        - JwtBearer: []
        - OAuthBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, label]
              properties:
                user_id: { type: integer, minimum: 1 }
                label: { type: string, minLength: 1, maxLength: 100 }
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Instante futuro con zona horaria; se almacena en UTC. Omitir para no expirar.
      responses:
        '201':
          description: Clave emitida. El secreto plain solo se entrega aquí (Cache-Control no-store).
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: '#/components/schemas/ApiKeyMetadata' }
                  plain: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Etiqueta ausente, expiración no futura, datos inválidos o usuario inactivo.
  /auth/api-key/users/{userId}/keys:
    get:
      summary: Listar metadatos de API Keys de un usuario (permiso ADMIN)
      security:
        - Basic: []
        - ApiKey: []
        - JwtBearer: []
        - OAuthBearer: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Lista de claves, incluidas expiradas y revocadas; nunca contiene plain ni hash.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKeyMetadata' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/api-key/revoke/{id}:
    post:
      summary: Revocar API Key (permiso ADMIN)
      security:
        - Basic: []
        - ApiKey: []
        - JwtBearer: []
        - OAuthBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Key revocada
        '409':
          description: API Key ya revocada; conserva el instante original.
          content:
            application/json:
              example: { error: already_revoked, detail: Esta API Key ya está revocada }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/basic/login:
    post:
      summary: Verificar credenciales Basic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Principal autenticado
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/jwt/login:
    post:
      summary: Login JWT con email+password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '201':
          description: Token emitido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/jwt/refresh:
    post:
      summary: Rotar JWT (revoca el anterior)
      responses:
        '200':
          description: Token nuevo
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/jwt/revoke:
    post:
      summary: Revocar JWT por jti
      responses:
        '204':
          description: Token revocado
  /auth/oauth/token:
    post:
      summary: Grant ROPC (RFC 6749 §5.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id, client_secret, username, password]
              properties:
                grant_type: { type: string, enum: [password] }
                client_id: { type: string }
                client_secret: { type: string }
                username: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Par de tokens
        '400':
          description: invalid_grant o unsupported_grant_type
  /auth/oauth/refresh:
    post:
      summary: Rotar par OAuth
      description: Renueva ambos tokens e invalida el access anterior. El reuso de un refresh revocado invalida la cadena descendente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 16 }
      responses:
        '200':
          description: Par nuevo (token_type, access_token, refresh_token, expires_in). Cache-Control no-store.
        '400':
          description: invalid_grant; reason distingue expired_token y revoked_token. Token desconocido no incluye reason.
          content:
            application/json:
              examples:
                expired:
                  value: { error: invalid_grant, reason: expired_token, detail: El token de renovación ha expirado }
                revoked:
                  value: { error: invalid_grant, reason: revoked_token, detail: El token de renovación ha sido revocado }
                unknown:
                  value: { error: invalid_grant }
  /auth/oauth/introspect:
    post:
      summary: Introspección RFC 7662 simplificada
      responses:
        '200':
          description: Estado del token
  /auth/oauth/revoke:
    post:
      summary: Revocar access token
      responses:
        '204':
          description: Token revocado
  /experiments:
    get:
      summary: Listar experimentos (permiso ADMIN)
      security: [{ApiKey: []}, {Basic: []}, {JwtBearer: []}, {OAuthBearer: []}]
      responses:
        '200':
          description: Experimentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Experiment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Crear experimento PENDING (permiso ADMIN)
      description: No inicia solicitudes ni establece started_at. No acepta credenciales del sujeto como configuración persistida.
      security: [{ApiKey: []}, {Basic: []}, {JwtBearer: []}, {OAuthBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mechanism, test_user_id, resources]
              properties:
                name: { type: string, maxLength: 255 }
                mechanism: { type: string, enum: [api_key, basic, jwt, oauth] }
                test_user_id:
                  description: ID numérico de un usuario existente; se admite su representación decimal string y se devuelve como string.
                  oneOf: [{type: integer, minimum: 1}, {type: string, pattern: '^[0-9]+$'}]
                resources:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [tickets.list] }
      responses:
        '201':
          description: Experimento PENDING creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validación; errors por campo. Mensajes obligatorios para name, mechanism y test_user_id.
  /experiments/{id}/start:
    post:
      summary: Iniciar un experimento existente (permiso ADMIN)
      description: |
        Transición atómica PENDING a RUNNING con started_at; no crea otro registro ni ejecuta solicitudes.
        La UI verifica al sujeto en /users/me y coordina dos GET /tickets secuenciales, con credencial
        válida e inválida, ambos con X-Experiment-Id. Depende de mantener el navegador abierto.
        COMPLETED, RUNNING y FAILED no pueden reiniciarse. Un histórico sin configuración no puede iniciarse.
      security: [{ApiKey: []}, {Basic: []}, {JwtBearer: []}, {OAuthBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Experimento RUNNING, mismo ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflicto identificable de transición
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, enum: [experiment_already_executed, experiment_running, experiment_failed, experiment_state_changed]}
                  detail: {type: string, example: Este experimento ya fue ejecutado}
        '422':
          description: Histórico sin usuario y recursos configurados
  /experiments/{id}/finish:
    post:
      summary: Cerrar un experimento RUNNING (permiso ADMIN)
      description: |
        Actualización condicional; conserva métricas y no sobrescribe fechas de experimentos cerrados.
        Sin status completa. FAILED permite informar un fallo operativo; el 401 negativo esperado no es un fallo del ejecutor.
        No verifica por sí mismo que el cliente haya enviado la secuencia; esa coordinación corresponde al frontend o al smoke.
      security: [{ApiKey: []}, {Basic: []}, {JwtBearer: []}, {OAuthBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [COMPLETED, FAILED], default: COMPLETED}
      responses:
        '200':
          description: Experimento COMPLETED o FAILED con finished_at
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: experiment_not_running o experiment_state_changed; no se modifica finished_at
        '422':
          description: Estado final inválido
  /experiments/{id}/privileges:
    post:
      summary: Cambiar privilegios del escenario
      description: Exige autenticación y permiso ADMIN, igual que la gestión del experimento.
      security: [{ApiKey: []}, {Basic: []}, {JwtBearer: []}, {OAuthBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                add_roles: { type: array, items: { type: string } }
                remove_roles: { type: array, items: { type: string } }
      responses:
        '204':
          description: Privilegios cambiados
  /experiments/{id}/events:
    get:
      summary: Eventos del experimento
      security: [{ApiKey: []}, {Basic: []}, {JwtBearer: []}, {OAuthBearer: []}]
      description: |
        Incluye credential_revoked cuando una revocación exitosa de API Key,
        JWT u OAuth envía X-Experiment-Id de un experimento RUNNING del mismo
        mecanismo. Payload contiene mechanism y after_metric_id (última muestra
        excluida del tramo posterior), nunca la credencial. La revocación y el
        evento se confirman en una transacción. Sin header se conserva el flujo
        existente sin evento. Contexto inválido devuelve 400 antes de revocar.
        Basic no tiene revocación de token; role_change no equivale a revocación.
      responses:
        '200':
          description: Eventos
  /experiments/{experimentId}/metrics:
    get:
      summary: Métricas del experimento
      description: |
        Una fila por solicitud efectivamente persistida. En un 401, mechanism
        identifica la rama de autenticación intentada por el servidor; sin
        evidencia estructural permanece none. No se atribuye una identidad
        autenticada a un intento fallido.
        Cada muestra incluye id y occurred_at (ISO 8601 con zona horaria), además
        de los campos existentes. Para analizar revocación, usar únicamente
        muestras posteriores al evento credential_revoked y con id mayor que
        after_metric_id. Las muestras históricas o sin mecanismo identificable
        con mechanism=none solo pueden atribuirse al mecanismo configurado
        cuando corresponden a una ejecución aislada.
        HTTP 401 por sí solo no distingue expiración, revocación o token inválido.
        No se exponen credenciales. La lectura conserva su política de acceso previa.
      responses:
        '200':
          description: Métricas
  /experiments/{experimentId}/metrics/compare:
    get:
      summary: Comparación (mediana/p95/stddev + pérdidas)
      responses:
        '200':
          description: Comparación con losses y valid
components:
  schemas:
    Experiment:
      type: object
      required: [id, name, mechanism, status, test_user_id, resources, created_at, started_at, finished_at]
      properties:
        id: {type: integer}
        name: {type: string}
        mechanism: {type: string, enum: [api_key, basic, jwt, oauth]}
        status: {type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED]}
        test_user_id: {type: string, nullable: true}
        resources:
          type: array
          nullable: true
          items: {type: string, enum: [tickets.list]}
        created_at: {type: string, format: date-time, nullable: true}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
    UserMeResponse:
      type: object
      required: [user, roles, permissions]
      properties:
        user:
          $ref: '#/components/schemas/UserMeIdentity'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleWithPermissions'
        permissions:
          type: array
          description: |
            Unión plana de los permisos de todos los roles del usuario.
            Deduplicada y ordenada ascendentemente. Vacía si ningún rol del
            usuario tiene permisos asignados.
          items:
            type: string
            example: READ

    UserMeIdentity:
      type: object
      required: [id, name, email, is_active]
      properties:
        id:
          type: string
          description: Identificador numérico serializado como string (UserId::value()).
          example: "1"
        name: { type: string }
        email: { type: string, format: email }
        is_active: { type: boolean }

    RoleWithPermissions:
      type: object
      required: [name, description, is_system, permissions]
      properties:
        name: { type: string, example: ADMIN }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        permissions:
          type: array
          description: Permisos asignados a este rol, sin deduplicar entre roles.
          items:
            type: string
          example: [ADMIN, READ]
    ApiKeyMetadata:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        label: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
  parameters:
    ExperimentId:
      name: X-Experiment-Id
      in: header
      required: false
      description: Activa el registro de métricas si el experimento está RUNNING
      schema:
        type: integer
    AuthMechanism:
      name: X-Auth-Mechanism
      in: header
      required: false
      description: Discriminador Bearer (jwt|oauth). Ausente equivale a jwt
      schema:
        type: string
        enum: [jwt, oauth]
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    Basic:
      type: http
      scheme: basic
    JwtBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuthBearer:
      type: http
      scheme: bearer
      description: Requiere X-Auth-Mechanism oauth
  responses:
    Unauthorized:
      description: Sin autenticación — siempre bare
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, example: unauthenticated }
    Forbidden:
      description: Autorización denegada — siempre con capa
      content:
        application/json:
          schema:
            type: object
            required: [error, layer]
            properties:
              error: { type: string, example: forbidden }
              layer: { type: string, enum: [rbac, ticket_rule] }
              detail: { type: string }
    NotFound:
      description: Recurso inexistente (antes que autorización)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: not_found }
    Conflict:
      description: Recurso protegido o en uso
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: conflict }
